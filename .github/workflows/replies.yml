name: Read replies (real account)

# The owner confirms real trades by replying in the ntfy app. ntfy.sh keeps
# messages for 12 hours, so this polls every 2 hours (GitHub may run it late;
# the gap still stays well inside 12 hours). Places no trades.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the alert channel setting (never prints it)
        env:
          NTFY_TOPIC_US: ${{ secrets.NTFY_TOPIC_US }}
        run: |
          if [ -z "$NTFY_TOPIC_US" ]; then echo "::warning title=health::NTFY_TOPIC_US secret is NOT set"; else echo "::notice title=health::NTFY_TOPIC_US secret is set (${#NTFY_TOPIC_US} chars)"; fi
      - name: Read replies
        shell: pwsh
        env:
          NTFY_TOPIC_US: ${{ secrets.NTFY_TOPIC_US }}
        run: ./scripts/Get-Replies.ps1
