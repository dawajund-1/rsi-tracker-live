name: Research (PLAN.md)

# Runs the pre-registered study once on demand. Fetches daily history from
# Yahoo (not reachable from the authoring sandbox), runs research/study.py and
# commits results/study.json plus the data manifest. Places no trades.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: Fetch daily history
        run: python research/fetch.py
      - name: Run the study
        run: python research/study.py
      - name: Commit results
        run: |
          git config user.name "rsi-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ universe/data_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Study results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
