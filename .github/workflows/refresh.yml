name: Live refresh (dashboard)

# Live prices + RSI for the dashboard during US market hours, and the owner's
# ntfy replies. No trading decision, no BUY/SELL alert. Started hourly by
# daily-cycle.yml; does nothing when the US market is closed.

on:
  workflow_dispatch: {}   # started hourly by daily-cycle.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh
        shell: pwsh
        env:
          NTFY_TOPIC_US: ${{ secrets.NTFY_TOPIC_US }}
        run: ./scripts/Get-Refresh.ps1
